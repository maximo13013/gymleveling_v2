<style>

<script>
/* GymLeveling hors-ligne: remplace les services Claude par un stockage local (localStorage). */
window.__SA=true;
(function(){
  const KEY='gymleveling_store_v1';let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){store={};}
  const clone=o=>JSON.parse(JSON.stringify(o));
  const ls=new Set();let t=null;
  function commit(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}ls.forEach(f=>setTimeout(f,0));}
  const kids=p=>Object.keys(store).filter(k=>k.startsWith(p+'/')&&k.indexOf('/',p.length+1)<0);
  function snapDoc(p){const ex=Object.prototype.hasOwnProperty.call(store,p);return{exists:ex,id:p.split('/').pop(),data:()=>ex?clone(store[p]):undefined,metadata:{fromCache:false}};}
  function ref(p){return{path:p,id:p.split('/').pop(),
    get:async()=>snapDoc(p),
    set:async d=>{store[p]=clone(d);commit();},
    update:async d=>{store[p]=Object.assign({},store[p]||{},clone(d));commit();},
    delete:async()=>{delete store[p];commit();},
    onSnapshot(cb){const f=()=>cb(snapDoc(p));ls.add(f);setTimeout(f,0);return()=>ls.delete(f);},
    collection:n=>col(p+'/'+n)};}
  function col(p,q){q=q||{};
    const run=()=>{let k=kids(p).map(x=>({id:x.split('/').pop(),k:x}));
      if(q.f)k.sort((a,b)=>{const x=store[a.k][q.f],y=store[b.k][q.f];return(x>y?1:x<y?-1:0)*(q.d==='desc'?-1:1);});
      if(q.n)k=k.slice(0,q.n);
      return{docs:k.map(x=>({id:x.id,data:()=>clone(store[x.k]),ref:ref(x.k)})),metadata:{fromCache:false}};};
    return{doc:id=>ref(p+'/'+id),
      orderBy:(f,d)=>col(p,Object.assign({},q,{f:f,d:d||'asc'})),

/* ---------- coach (règles, sans IA) ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function limits(p){
  let cap=LVN[p.level]!=null?LVN[p.level]:0;
  cap=Math.min(cap,p.exp==='lt6'?0:p.exp==='lt24'?1:2);
  const eq=new Set(['corps']);(p.equip||[]).forEach(e=>eq.add(e));
  const notes=[];
  if(p.age==='u16'){cap=0;eq.delete('barre');eq.delete('machines');notes.push('Moins de 16 ans: exercices au poids du corps ou aux haltères légers, avec un adulte ou un encadrant présent.');}
  else if(p.age==='a16'){cap=Math.min(cap,1);eq.delete('barre');notes.push('Avant 18 ans: pas de barre chargée. Privilégie la technique et des charges modérées, idéalement avec un encadrant.');}
  else if(p.age==='a60'){cap=Math.min(cap,1);notes.push('À partir de 60 ans: échauffe-toi plus longtemps, prends des repos plus longs et demande un avis médical au moindre doute.');}
  else if(p.age==='a40'){notes.push('Échauffe-toi progressivement avant les exercices lourds.');}
  return {lvl:['debutant','intermediaire','avance'][cap],eq,notes,young:p.age==='u16'||p.age==='a16',senior:p.age==='a60'};
}
function rx(ex,L,minutes){
  const sets=L.lvl==='debutant'?(minutes>=45?3:2):(L.lvl==='avance'&&ex.big&&minutes>=60?4:3);
  let reps;
  if(ex.unit==='s')reps='20-40 s';
  else if(L.young||L.senior)reps='12-15';
  else if(ex.big)reps=L.lvl==='debutant'?'10-12':L.lvl==='intermediaire'?'8-12':'6-10';
  else reps=L.lvl==='avance'?'10-15':'12-15';
  const rest=ex.unit==='s'?45:(ex.big?(L.lvl==='avance'?120:90):60)+(L.senior?30:0);
  return {id:ex.id,sets,target:sets+' × '+reps,rest};
}
function genSession(p,groups,minutes,seed){
  const L=limits(p),r=rng(seed);
  const pool=LIB.filter(e=>L.eq.has(e.equip)&&LVN[e.level]<=LVN[L.lvl]);
  const gs=groups&&groups.length?groups:Object.keys(G);
  const n=clamp(Math.round(minutes/12),3,8);
  const lists=gs.map(g=>{const l=pool.filter(e=>e.g.includes(g));return shuffle(l.filter(e=>e.big),r).concat(shuffle(l.filter(e=>!e.big),r));});
  const picked=[],used=new Set();
  for(let guard=0;picked.length<n&&guard<20;guard++){
    let added=false;
    for(const l of lists){if(picked.length>=n)break;const e=l.find(x=>!used.has(x.id));if(e){used.add(e.id);picked.push(e);added=true;}}
    if(!added)break;
  }
  if(!picked.length&&groups&&groups.length){const s=genSession(p,[],minutes,seed);s.notes=['Aucun exercice ne correspond à ce matériel pour ces groupes: voici une séance complète.'].concat(s.notes);return s;}
  picked.sort((a,b)=>(b.big?1:0)-(a.big?1:0)||(a.g[0]==='abdos'?1:0)-(b.g[0]==='abdos'?1:0));
  return {name:gs.length===7?'Corps entier':gs.map(g=>G[g]).join(' · '),exercises:picked.map(e=>rx(e,L,minutes)),minutes,lvl:L.lvl,notes:L.notes};
}

function genProgram(p,days,minutes,seed){
  const L=limits(p),split=SPLITS[days]||SPLITS[3];
  const list=split.map((gs,i)=>{const s=genSession(p,gs,minutes,seed+i*101);return {name:'Jour '+(i+1)+' · '+s.name,exercises:s.exercises};});
  return {name:'Programme '+days+' jours',days:list,lvl:L.lvl,minutes,notes:L.notes.concat(['Garde au moins un jour de repos entre deux séances qui sollicitent les mêmes muscles.','Toutes les 4 semaines, prévois une semaine plus légère pour récupérer.'])};
}

/* ---------- séances ---------- */
function lastPerf(id){for(const s of S.sessions){const e=(s.exercises||[]).find(x=>x.id===id);if(e&&e.sets&&e.sets.length)return e.sets;}return null;}
function buildSession(tpl){
  const exs=[];
  (tpl.exercises||[]).forEach(t=>{
    const e=LIBBY[t.id];if(!e)return;
    const last=lastPerf(e.id),sets=[];
    for(let i=0;i<(t.sets||3);i++){const ls=last&&(last[i]||last[last.length-1]);sets.push({kg:ls&&ls.kg>0?ls.kg:null,reps:null,done:false});}
    exs.push({id:e.id,name:e.name,g:e.g,unit:e.unit,target:t.target||'',rest:t.rest||75,sets});
  });
  const now=Date.now();
  return {id:'s'+now.toString(36),name:tpl.name||'Séance libre',status:'active',date:todayStr(),startedAt:now,exercises:exs,programIndex:tpl.programIndex==null?null:tpl.programIndex};
}
let saveTimer=null,saving=false,dirty=false;
function paintSave(){
  const el=$('#savestate');if(!el)return;
  const m={idle:'',pending:'Enregistrement…',saved:'Sauvegardé',error:'Non sauvegardé, touche pour réessayer'};
  el.textContent=m[S.saveState]||'';el.className='save'+(S.saveState==='error'?' err':'');
}
function touch(){if(!S.active)return;dirty=true;S.saveState='pending';paintSave();clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);}
async function flush(){
  clearTimeout(saveTimer);
  if(saving||!dirty||!S.active||!sessCol)return;
  saving=true;dirty=false;
  try{await sessCol.doc(S.active.id).set(clone(S.active));S.saveState=dirty?'pending':'saved';}
  catch(e){dirty=true;S.saveState='error';}
  saving=false;paintSave();
  if(dirty&&S.saveState!=='error')flush();
}
async function writeSession(doc){for(let i=0;i<2;i++){try{await sessCol.doc(doc.id).set(clone(doc));return true;}catch(e){await sleep(400);}}return false;}
function fullBodyTpl(){
  const left=new Set(Object.keys(MUS)),out=[];
  const prim=e=>(MM[e.id]||[]).filter(m=>m[2]==='p').map(m=>m[0]);
  const pool=LIB.filter(e=>e.equip!=='corps'&&prim(e).length);
  let guard=60;
  while(left.size&&guard--){
    let best=null,bs=0;
    pool.forEach(e=>{if(out.includes(e))return;const n=prim(e).filter(k=>left.has(k)).length;const s=n*10+(e.big?1:0);if(n&&s>bs){bs=s;best=e;}});
    if(!best)break;
    out.push(best);prim(best).forEach(k=>left.delete(k));
  }
  [...left].forEach(k=>{
    const c=LIB.filter(e=>e.equip!=='corps'&&!out.includes(e)&&(MM[e.id]||[]).some(m=>m[0]===k)).sort((a,b)=>((MM[b.id].find(m=>m[0]===k)||[0,0])[1])-((MM[a.id].find(m=>m[0]===k)||[0,0])[1]))[0];
    if(c){out.push(c);left.delete(k);}
  });
  return{name:'Séance 24 muscles',exercises:out.map(e=>({id:e.id,sets:3,rest:e.big?90:60})),missing:[...left]};
}
const PRESETS=[
 {id:'bf',n:'Séance Basic-Fit',d:'Uniquement des machines et poulies, tous les muscles',f:e=>e.equip==='machines',all:true,extra:['pec_i','dorsal','quads','delt_l','biceps','triceps','ischios']},
 {id:'bw',n:'Séance poids du corps',d:'Sans matériel, tous les muscles',f:e=>e.equip==='corps',all:true},
 {id:'pl',n:'Séance poids libres',d:'Haltères et barre, tous les muscles',f:e=>e.equip==='halteres'||e.equip==='barre',all:true,extra:['pec_i','dorsal','quads','delt_l']},
 {id:'pt',n:'Pecs + triceps',d:'3 muscles ciblés',m:['pec_s','pec_i','triceps'],per:2},
 {id:'db',n:'Dos + biceps',d:'4 muscles ciblés',m:['dorsal','rhomb','rond','biceps'],per:2},
 {id:'et',n:'Épaules + trapèzes',d:'4 muscles ciblés',m:['delt_a','delt_l','delt_p','trap'],per:2},
 {id:'jb',n:'Jambes et fessiers',d:'4 muscles ciblés',m:['quads','ischios','fessiers','mollets'],per:2},
 {id:'br',n:'Bras complets',d:'Biceps, triceps, avant-bras',m:['biceps','triceps','fl_av','ex_av'],per:2},

];
function presetTpl(id){
  const P=PRESETS.find(x=>x.id===id);if(!P)return null;
  const prim=e=>(MM[e.id]||[]).filter(m=>m[2]==='p').map(m=>m[0]);
  const out=[];
  if(P.all){
    const left=new Set(Object.keys(MUS)),pool=LIB.filter(e=>P.f(e)&&prim(e).length);
    for(let g=60;left.size&&g--;){
      let best=null,bs=0;
      pool.forEach(e=>{if(out.includes(e))return;const n=prim(e).filter(k=>left.has(k)).length,s=n*10+(e.big?1:0);if(n&&s>bs){bs=s;best=e;}});
      if(!best)break;out.push(best);prim(best).forEach(k=>left.delete(k));
    }
    [...left].forEach(k=>{
      const c=LIB.filter(e=>P.f(e)&&!out.includes(e)&&(MM[e.id]||[]).some(m=>m[0]===k)).sort((a,b)=>((MM[b.id].find(m=>m[0]===k)||[0,0])[1])-((MM[a.id].find(m=>m[0]===k)||[0,0])[1]))[0];
      if(c){out.push(c);left.delete(k);}
    });
    (P.extra||[]).forEach(k=>{const c=pool.filter(e=>!out.includes(e)&&prim(e).includes(k)).sort((a,b)=>(b.big||0)-(a.big||0))[0];if(c)out.push(c);});
  }else{
    const cnt={};P.m.forEach(k=>cnt[k]=0);
    for(let round=0;round<P.per;round++)P.m.forEach(k=>{
      let best=null,bs=-1e9;
      LIB.forEach(x=>{if(out.includes(x))return;const p=prim(x);if(!p.includes(k))return;
        const inn=p.filter(q=>P.m.includes(q)).length,off=p.length-inn;
        const s=-p.length*3-off*10+(x.big?2:0)+(x.equip==='corps'?0:1)+(round&&out.some(o=>o.equip===x.equip)?0:1);
        if(s>bs){bs=s;best=x;}});
      if(best)out.push(best);
    });
  }
  return{name:P.n,exercises:out.map(e=>({id:e.id,sets:3,rest:e.big?90:60}))};
}
function presetsCard(){
  return '<div class="card"><h2>Séances prêtes à l’emploi</h2><div class="opts">'+PRESETS.map(p=>'<button type="button" class="opt" data-act="start-preset" data-id="'+p.id+'"><b>'+esc(p.n)+'</b><small>'+esc(p.d)+'</small></button>').join('')+'</div><p class="hint">Tu peux modifier les exercices une fois la séance lancée.</p></div>';
}
async function startSession(tpl){
  if(S.active){toast('Une séance est déjà en cours.');S.tab='train';render();return;}
  S.active=buildSession(tpl);S.summary=null;S.confirm=null;S.expanded.clear();S.tab='train';
  touch();render();flush();
}
function addExercise(id){
  const e=LIBBY[id];if(!e||!S.active)return;
  const last=lastPerf(id),ls=last&&last[0];
  S.active.exercises.push({id:e.id,name:e.name,g:e.g,unit:e.unit,target:'',rest:e.big?90:60,sets:[{kg:ls&&ls.kg>0?ls.kg:null,reps:null,done:false}]});
  touch();
}
async function finishSession(){
  const a=S.active;if(!a)return;
  const ex=a.exercises.map(e=>({id:e.id,name:e.name,g:e.g,unit:e.unit,sets:e.sets.filter(s=>s.done&&s.reps>0).map(s=>({kg:s.kg||0,reps:s.reps}))})).filter(e=>e.sets.length);
  const endedAt=Date.now();
  let vol=0,n=0;ex.forEach(e=>e.sets.forEach(s=>{n++;if(e.unit!=='s')vol+=s.kg*s.reps;}));
  const doc={id:a.id,name:a.name,status:'done',date:a.date,startedAt:a.startedAt,endedAt,durationMin:Math.max(1,Math.round((endedAt-a.startedAt)/60000)),volume:Math.round(vol),setsDone:n,exercises:ex,programIndex:a.programIndex==null?null:a.programIndex};
  S.finished.add(a.id);clearTimeout(saveTimer);
  while(saving)await sleep(60);
  dirty=false;
  if(!(await writeSession(doc))){S.finished.delete(a.id);S.confirm=null;render();toast('Enregistrement impossible. Ta séance reste ouverte, réessaie.');return;}
  S.active=null;S.rest=null;S.confirm=null;S.saveState='idle';
  const tb=muscleTiers();S.sessions=[doc].concat(S.sessions.filter(x=>x.id!==doc.id));S.summary=doc;const ta=muscleTiers();S.unlocked=Object.keys(MUS).filter(k=>ta[k]>tb[k]).map(k=>({k:k,to:ta[k]}));
  const pr=S.profile.program;
  if(doc.programIndex!=null&&pr&&pr.days&&pr.days.length){const ni=(doc.programIndex+1)%pr.days.length;saveProfile({nextSession:{name:pr.days[ni].name,exercises:pr.days[ni].exercises,programIndex:ni}});}
  render();
}
async function abandonSession(){
  const a=S.active;if(!a)return;
  S.finished.add(a.id);clearTimeout(saveTimer);
  while(saving)await sleep(60);
  dirty=false;
  try{await sessCol.doc(a.id).delete();}catch(e){}
  S.active=null;S.rest=null;S.confirm=null;S.saveState='idle';render();toast('Séance abandonnée');
}

function loggedExercises(){const m=new Map();S.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{const c=m.get(e.id)||{id:e.id,name:e.name,n:0};c.n++;m.set(e.id,c);}));return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));}
function series(id){
  const pts=[];let anyKg=false;
  S.sessions.slice().reverse().forEach(s=>{const e=(s.exercises||[]).find(x=>x.id===id);if(!e||!e.sets||!e.sets.length)return;const kg=Math.max(...e.sets.map(x=>x.kg||0)),rp=Math.max(...e.sets.map(x=>x.reps||0));if(kg>0)anyKg=true;pts.push({l:dm(parseDate(s.date)),kg,rp});});
  return {kind:anyKg?'kg':'reps',pts:pts.map(p=>({l:p.l,y:anyKg?p.kg:p.rp}))};
}
function records(){
  const best=new Map();
  S.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{if(e.unit==='s')return;e.sets.forEach(x=>{if(x.kg>0&&x.reps>0&&x.reps<=12){const v=x.kg*(1+x.reps/30),c=best.get(e.id);if(!c||v>c.v)best.set(e.id,{id:e.id,name:e.name,v,kg:x.kg,reps:x.reps});}});}));
  return [...best.values()].sort((a,b)=>b.v-a.v).slice(0,6);
}
function groupSets(days){
  const since=Date.now()-days*864e5,c={};
  S.sessions.forEach(s=>{if(s.startedAt<since)return;(s.exercises||[]).forEach(e=>{const g=(e.g&&e.g[0])||(LIBBY[e.id]&&LIBBY[e.id].g[0]);if(g)c[g]=(c[g]||0)+(e.sets||[]).length;});});
  return c;
}
function tips(){
  const out=[],now=Date.now();
  const last7=S.sessions.filter(s=>now-s.startedAt<7*864e5).length;
  if(last7>=6)out.push('Tu as fait '+last7+' séances en 7 jours. Prévois au moins un jour de repos pour bien récupérer.');
  const by={};S.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{(by[e.id]=by[e.id]||[]).push(e);}));
  const top=e=>Math.max(...e.sets.map(x=>x.kg||0));
  const ok=e=>e.unit!=='s'&&e.sets.length>=3&&top(e)>0&&e.sets.every(x=>x.kg===top(e)&&x.reps>=12);
  Object.keys(by).forEach(id=>{const l=by[id];if(out.length>=3||l.length<2)return;if(ok(l[0])&&ok(l[1])&&top(l[0])===top(l[1]))out.push(l[0].name+': 12 répétitions sur toutes les séries à '+fmt(top(l[0]))+' kg, deux séances de suite. Tu peux envisager une petite hausse (1 à 2 kg) si la technique reste propre, sinon garde la même charge.');});
  if(S.sessions.length>=3&&out.length<3){const c=groupSets(14);const miss=Object.keys(G).find(g=>!c[g]&&g!=='abdos');if(miss)out.push('Aucun travail sur '+G[miss].toLowerCase()+' depuis 2 semaines. Pense à l’intégrer dans une prochaine séance.');}
  return out.slice(0,3);
}

/* ---------- graphiques ---------- */
function niceTop(m){const mag=Math.pow(10,Math.floor(Math.log10(m))),n=m/mag;return Math.max(2,(n<=1?1:n<=2?2:n<=5?5:10)*mag);}
const tick=v=>v>=1000?(Math.round(v/100)/10).toString().replace('.',',')+'k':String(Math.round(v*10)/10).replace('.',',');
function barChart(labels,vals){
  const W=340,H=170,l=32,r=8,t=16,b=24,iw=W-l-r,ih=H-t-b,top=niceTop(Math.max(1,...vals)),bw=iw/vals.length*.62;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graphique en barres">';
  (Number.isInteger(top/2)?[0,.5,1]:[0,1]).forEach(f=>{const y=t+ih-ih*f;s+='<line class="c-grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="c-txt" x="'+(l-5)+'" y="'+(y+3)+'" text-anchor="end">'+tick(top*f)+'</text>';});
  vals.forEach((v,i)=>{const cx=l+iw/vals.length*(i+.5),h=ih*v/top;
    s+='<rect class="c-bar'+(i===vals.length-1?' hi':'')+'" x="'+(cx-bw/2)+'" y="'+(t+ih-h)+'" width="'+bw+'" height="'+(v>0?Math.max(h,2):0)+'" rx="3"/>';
    if(v>0)s+='<text class="c-val" x="'+cx+'" y="'+(t+ih-h-4)+'" text-anchor="middle">'+tick(v)+'</text>';
    s+='<text class="c-txt" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+labels[i]+'</text>';});
  return s+'</svg>';
}
function lineChart(pts){
  const W=340,H=170,l=36,r=16,t=18,b=24,iw=W-l-r,ih=H-t-b,ys=pts.map(p=>p.y);
  const mn=Math.min(...ys),mx=Math.max(...ys),pad=(mx-mn)?(mx-mn)*.25:Math.max(1,mx*.1),lo=Math.max(0,mn-pad),hi=mx+pad;
  const X=i=>pts.length===1?l+iw/2:l+iw*i/(pts.length-1),Y=v=>t+ih-ih*(v-lo)/(hi-lo);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe de progression">';
  [lo,(lo+hi)/2,hi].forEach(v=>{const y=Y(v);s+='<line class="c-grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="c-txt" x="'+(l-5)+'" y="'+(y+3)+'" text-anchor="end">'+tick(v)+'</text>';});
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  if(pts.length>1)s+='<path class="c-area" d="'+path+' L'+X(pts.length-1).toFixed(1)+' '+(t+ih)+' L'+X(0).toFixed(1)+' '+(t+ih)+' Z"/><path class="c-line" d="'+path+'"/>';
  pts.forEach((p,i)=>{const last=i===pts.length-1;if(last||pts.length<=20)s+='<circle class="c-dot'+(last?' hi':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5:3)+'"/>';});
  const lastP=pts[pts.length-1];
  s+='<text class="c-val" x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(lastP.y)-10).toFixed(1)+'" text-anchor="'+(pts.length>1?'end':'middle')+'">'+tick(lastP.y)+'</text>';
  const idx=pts.length>=3?[0,Math.floor((pts.length-1)/2),pts.length-1]:pts.map((p,i)=>i);
  idx.forEach(i=>{s+='<text class="c-txt" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(pts.length===1?'middle':i===0?'start':i===pts.length-1?'end':'middle')+'">'+pts[i].l+'</text>';});
  return s+'</svg>';
}

const FREE_CAP=250000;

async function saveEdit(){
  if(!S.edit)return;
  const d=clone(S.edit.doc);let vol=0,n=0;
  for(const e of d.exercises){for(const x of e.sets){
    if(!(x.reps>0)){toast('Indique les répétitions de chaque série.');return;}
    x.kg=x.kg||0;n++;if(e.unit!=='s')vol+=x.kg*x.reps;
  }}
  d.volume=Math.round(vol);d.setsDone=n;
  if(!(await writeSession(d))){toast('Enregistrement impossible. Vérifie ta connexion et réessaie.');return;}
  S.sessions=S.sessions.map(x=>x.id===d.id?d:x);closeSheet();render();toast('Séance modifiée');
}

async function aiSend(q){
  const a=S.ai||(S.ai={msgs:[],busy:false});q=String(q||'').trim().slice(0,600);
  if(a.busy||!q)return;
  a.msgs.push({r:'user',t:q});const last={r:'ai',t:''};a.msgs.push(last);a.busy=true;render();
  const box=()=>{const el=$('#ai-last');if(el){el.textContent=last.t||'Il réfléchit…';const c=el.parentNode;if(c)c.scrollTop=c.scrollHeight;}};
  try{
    const sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;
    if(!sample)throw {code:'unavailable'};
    const hist=a.msgs.slice(0,-1).slice(-11);
    const conv=hist.map((m,i)=>({role:m.r==='user'?'user':'assistant',content:(i===0?aiContext()+'\n\nConversation:\n':'')+m.t}));
    if(conv[0].role!=='user')conv.shift(),conv.unshift({role:'user',content:aiContext()+'\n\nConversation:\n(suite)'});
    const res=await sample(conv,{cache:false,modelTier:'default',onText:({text})=>{last.t=text;box();}});
    last.t=(res&&res.text)||last.t||'Je n’ai pas pu répondre. Réessaie.';
  }catch(e){
    const c=e&&e.code;
    a.denied=(c==='not_granted');
    last.t=e&&e.text?e.text:(c==='not_granted'?'L’accès au coach IA est refusé. Touche « Gérer les autorisations » ci-dessous pour l’autoriser, ou recharge la page.':c==='rate_limited'?'Trop de demandes pour le moment. Patiente un peu avant de réessayer.':c==='unavailable'?'Le coach IA n’est pas disponible dans cette vue.':'Le coach IA est indisponible pour le moment. Réessaie dans un instant.');
  }
  a.busy=false;render();
  const c=$('.aichat');if(c)c.scrollTop=c.scrollHeight;
}

function readPhoto(file){

    if(!file||!/^image\//.test(file.type)){rej(new Error('type'));return;}
    if(file.size>12*1048576){rej(new Error('size'));return;}
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('img'));
      im.onload=()=>{
        const N=192,c=document.createElement('canvas');c.width=N;c.height=N;
        const g=c.getContext('2d'),s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;
        g.fillStyle='#131715';g.fillRect(0,0,N,N);g.drawImage(im,sx,sy,s,s,0,0,N,N);
        res(c.toDataURL('image/jpeg',.82));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const normS=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9]+/g,' ').trim();
function editDist(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
    let v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,d[i-2][j-2]+1);
    d[i][j]=v;
  }
  return d[a.length][b.length];
}
function fuzzyScore(name,q){
  const n=normS(name),toks=normS(q).split(' ').filter(Boolean);
  if(!toks.length)return 0;
  if(n.includes(normS(q)))return 100;
  const words=n.split(' ');let total=0;
  for(const t of toks){
    if(n.includes(t)){total+=10;continue;}
    const tol=t.length>=7?2:t.length>=4?1:0;let best=99;
    words.forEach(w=>{if(!w)return;best=Math.min(best,editDist(t,w,tol),w.length>t.length?editDist(t,w.slice(0,t.length),tol)+0.5:99);});
    if(best>tol)return -1;
    total+=5-best;
  }
  return total;
}

    s[d.k]=v==null?null:(d.k==='kg'?Math.min(v,1000):Math.min(Math.round(v),999));
    touch();
  }
});
document.addEventListener('change',e=>{if(e.target.id==='ph-file'){const fl=e.target.files&&e.target.files[0];readPhoto(fl).then(u=>{S.sd.photo=u;render();}).catch(er=>toast(er.message==='size'?'Photo trop lourde (12 Mo maximum).':'Impossible de lire cette image.'));e.target.value='';return;}
  const f=e.target.dataset&&e.target.dataset.field;if(f==='progEx'){S.progEx=e.target.value;render();}else if(f==='exoSel'){S.exoSel=e.target.value;render();}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='ai-in'){e.preventDefault();aiSend(e.target.value);return;}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.dataset&&e.target.dataset.act==='muscle'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});

/* ---------- démarrage ---------- */
function typing(){const a=document.activeElement;return !!(a&&a.matches&&a.matches('#view input,#view select,#view textarea'));}
async function boot(){
  render();
  setTimeout(()=>{if(!S.profileLoaded&&!S.noDb){S.slow=true;render();}},10000);
  if(!window.claude||!window.claude.use){S.noDb=true;render();return;}
  let user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);}catch(e){}
  gUser=user;
  const uid=user?await user.id():null;
  if(!db||!uid){S.noDb=true;render();return;}
  S.uid=uid;watchRank();watchDonate();
  profRef=db.doc('data/users/'+uid+'/profile');
  sessCol=profRef.collection('sessions');
  profRef.onSnapshot(snap=>{
    if(snap.exists){S.profile=clone(snap.data());S.profileLoaded=true;registerCustom(S.profile.custom);pubRank();}
    else if(!snap.metadata.fromCache){S.profile=null;S.profileLoaded=true;}
    else return;
    if(!typing())render();
  },err=>{S.err=err.code;render();});
  sessCol.orderBy('startedAt','desc').limit(1000).onSnapshot(snap=>{
    const all=snap.docs.map(d=>Object.assign(clone(d.data()),{id:d.id}));
    S.sessions=all.filter(s=>s.status==='done');
    if(!S.active){const a=all.find(s=>s.status==='active'&&!S.finished.has(s.id));if(a)S.active=a;}
    const sig=S.sessions.map(s=>s.id+':'+(s.volume||0)).join(',')+'|'+(S.active?S.active.id:''),first=!S.sessLoaded,same=sig===S.sSig;
    S.sSig=sig;S.sessLoaded=true;pubRank();
    if(!first&&same&&S.tab==='train'&&S.active)return;
    if(!typing())render();
  },err=>{S.err=err.code;render();});
}
boot();
</script>
